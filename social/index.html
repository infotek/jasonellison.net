        <style>
            :root {
                --bg: #030a03;             /* Deep CRT dark background */
                --text: #33ff33;           /* Classic P31 green phosphor text */
                --dim-text: #1d991d;       /* Muted green for inactive elements */
                --border: #004400;         /* Subtle dark green borders */
                --accent: #66ff66;         /* High-luminance green for highlights */
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                font-size: 100%;
            }

            body {
                font-size: clamp(16px, 3dvw, 20px);
                background-color: var(--bg);
                color: var(--text);
                font-family: "Courier New", Courier, monospace, system-ui;
                min-height: 100dvh;
                margin: 0;
                padding: 2rem 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                /* CRT Scanline Overlay Effect */
                background-image: linear-gradient(
                    rgba(0, 0, 0, 0) 50%,
                    rgba(0, 0, 0, 0.4) 50%
                );
                background-size: 100% 4px;
            }

            .container {
                position: fixed;
                left: 0;
                top: 0;
                right: 0;
                bottom: 0;
                z-index: -1;
                overflow: hidden;
                pointer-events: none;
            }

            .container canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            /* Layout & Navigation */
            main {
                width: 100%;
                max-width: 800px;
                z-index: 1;
            }

            nav {
                display: flex;
                gap: 1rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.75rem;
                margin-bottom: 2rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a, nav button {
                background: none;
                border: 1px solid transparent;
                color: var(--dim-text);
                font-family: inherit;
                font-size: 1rem;
                cursor: pointer;
                padding: 0.4rem 0.8rem;
                border-radius: 2px;
                text-decoration: none;
                transition: color 0.2s, border-color 0.2s;
            }

            nav a:hover, nav button:hover, nav a.active, nav button.active {
                color: var(--text);
                border-color: var(--text);
                background-color: rgba(51, 255, 51, 0.05);
                text-shadow: 0 0 6px var(--dim-text);
            }

            /* Active nav link (the current page) */
            nav a.active {
                border-color: var(--accent);
            }

            a {
                color: var(--accent);
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
                text-shadow: 0 0 8px var(--text);
            }

            ul {
                margin-top: 0.5rem;
                padding-left: 1.5rem;
            }

            li {
                margin-bottom: 0.5rem;
            }

            h1, h2, h3, .term-heading {
                color: var(--accent);
                text-shadow: 0 0 6px rgba(51, 255, 51, 0.4);
            }

            /* Section-specific helpers (replace one-off inline styles) */
            .section-intro {
                margin-bottom: 1rem;
            }

            .list-heading {
                color: var(--text);
                margin-top: 0;
                margin-bottom: 0.75rem;
            }

            .list-plain {
                list-style-type: none;
                padding-left: 0;
                margin: 0;
                line-height: 1.8;
            }

            .sublist {
                list-style-type: none;
                padding-left: 1.5rem;
                margin-top: 0.25rem;
            }

            .dim-caption {
                margin-bottom: 0.5rem;
                color: var(--dim-text);
            }

            .media-wrap {
                max-width: 640px;
                margin-left: auto;
                margin-right: auto;
            }

            .media-wrap + .media-wrap {
                margin-top: 1.5rem;
            }

            .media-video {
                width: 100%;
                border: 2px solid var(--border);
                box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
                background: #000;
            }

            /* Sailing: video listing (link cards to the watch pages) */
            .video-list {
                list-style-type: none;
                padding-left: 0;
                margin-top: 1rem;
            }

            .video-list li {
                margin-bottom: 1.5rem;
            }

            .video-thumb {
                display: block;
                width: 100%;
                max-width: 640px;
                border: 2px solid var(--border);
                box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
                background: #000;
            }

            .video-thumb:hover {
                border-color: var(--accent);
            }

            /* Terminal Prompt & Blinking Cursor Styling */
            .prompt::before {
                content: "infotek@darkstar:~$ ";
                color: var(--dim-text);
                font-weight: normal;
            }

            .cursor::after {
                content: "█";
                display: inline-block;
                margin-left: 4px;
                color: var(--text);
                animation: blink 1s step-start infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .terminal-avatar {
                position: fixed;
                bottom: 0;
                right: 1.5rem;
                width: clamp(130px, 16vw, 210px);
                height: auto;
                z-index: 10;
                pointer-events: none;
                filter: drop-shadow(0 0 14px rgba(51, 255, 51, 0.35));
                opacity: 0.9;
            }

            @media (max-width: 600px) {
               .terminal-avatar {
                   width: 95px;
                   right: 0.5rem;
                   opacity: 0.65;
               }
            }

            @media (prefers-reduced-motion: reduce) {
                .cursor::after {
                    animation: none;
                }
            }
        </style>
